<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>legal_graphrag</title>
<style>
  :root {
    --border: #d8dbe0; --bg: #f7f8fa; --card-bg: #ffffff; --accent: #2f5d8a;
    --low: #c22b2b; --mono: "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: #1c1f24; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #666; margin: 0 0 20px; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn { padding: 8px 16px; border: 1px solid var(--border); background: #eee; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; max-width: 720px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
  textarea { resize: vertical; min-height: 60px; }
  button { margin-top: 12px; padding: 9px 18px; border: none; border-radius: 6px; background: var(--accent); color: white; font-size: 14px; cursor: pointer; }
  button.secondary { background: #888; }
  button.danger { background: var(--low); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* Output: always visible, never collapsed */
  .output-card { border: 2px solid var(--accent); border-radius: 8px; padding: 16px; background: var(--card-bg); max-width: 640px; margin-top: 16px; }
  .output-card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .output-text { font-size: 16px; line-height: 1.5; white-space: pre-wrap; }

  /* Everything else: collapsible */
  details.collapsible { max-width: 640px; margin-top: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); }
  details.collapsible summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; padding: 10px 12px; }
  details.collapsible .content { padding: 0 12px 12px; }
  details.collapsible pre { background: #1c1f24; color: #d7dbe0; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; font-family: var(--mono); }
  .chunk { border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 6px; font-size: 12px; }
  .chunk .meta { color: #777; margin-bottom: 4px; }

  .status-pill { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; background: #e6e9ee; color: #333; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .muted { color: #888; font-size: 13px; }
  .error { color: var(--low); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<h1>legal_graphrag</h1>
<p class="subtitle">Manual inspection UI — the Answer stays visible; everything else is collapsed by default.</p>

<div class="tabs">
  <button class="tab-btn active" data-tab="ask">Ask</button>
  <button class="tab-btn" data-tab="ingest">Ingest</button>
  <button class="tab-btn" data-tab="threads">Threads</button>
</div>

<!-- ============================== ASK ============================== -->
<div class="panel active" id="panel-ask">
  <div class="card">
    <label>Question</label>
    <textarea id="ask-question" placeholder="What is the agreement date?"></textarea>
    <label>Chroma collection name</label>
    <select id="ask-collection"></select>
    <button id="ask-submit">Ask</button>
    <div class="error" id="ask-error"></div>
  </div>

  <div id="ask-result"></div>
</div>

<!-- ============================== INGEST ============================== -->
<div class="panel" id="panel-ingest">
  <div class="card">
    <label>PDF file</label>
    <input type="file" id="ingest-file" accept="application/pdf" />
    <label>Collection name (optional — derived from filename if blank)</label>
    <input type="text" id="ingest-collection" placeholder="my_contract" />
    <button id="ingest-submit">Ingest</button>
    <div class="error" id="ingest-error"></div>
  </div>
  <div id="ingest-result" class="card" style="display:none;"></div>
</div>

<!-- ============================== THREADS ============================== -->
<div class="panel" id="panel-threads">
  <div class="card">
    <button id="threads-refresh" class="secondary">Refresh</button>
    <table id="threads-table">
      <thead><tr><th>Question</th><th>Collection</th><th>Status</th><th>Created</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="muted" id="threads-empty">No threads yet — ask a question first.</p>
  </div>
</div>

<script type="module" src="./dist/main.js"></script>
</body>
</html>
